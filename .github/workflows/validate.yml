name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      # Offline, safe checks only: no market-data download, no exchange access,
      # live trading stays disabled. Dataset-dependent tests are skipped.
      - name: Validation suite
        run: python scripts/run_validation.py
