<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Calculator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f2f4f7;
      color: #1f2933;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
      box-sizing: border-box;
    }

    .calculator {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 24px;
      width: 100%;
      max-width: 360px;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
      padding: 10px;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    input:focus {
      outline: 2px solid #3b82f6;
      border-color: #3b82f6;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      font-size: 1.3rem;
      padding: 12px 0;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      min-height: 1.5em;
      font-size: 1.1rem;
      background: #f2f4f7;
      word-break: break-all;
    }

    #result.error {
      background: #fde8e8;
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>Simple Calculator</h1>

    <label for="num1">First number</label>
    <input type="number" id="num1" step="any" placeholder="Enter a number">

    <label for="num2">Second number</label>
    <input type="number" id="num2" step="any" placeholder="Enter a number">

    <div class="buttons">
      <button type="button" data-op="+" aria-label="Add">+</button>
      <button type="button" data-op="-" aria-label="Subtract">&minus;</button>
      <button type="button" data-op="*" aria-label="Multiply">&times;</button>
      <button type="button" data-op="/" aria-label="Divide">&divide;</button>
    </div>

    <div id="result" aria-live="polite">Result will appear here</div>
  </div>

  <script>
    const num1 = document.getElementById("num1");
    const num2 = document.getElementById("num2");
    const resultEl = document.getElementById("result");

    const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

    function readNumber(input, name) {
      // A number input reports badInput when the user typed something
      // that isn't a number (its value is then "").
      if (input.validity.badInput) {
        throw new Error(name + " is not a valid number.");
      }
      if (input.value.trim() === "") {
        throw new Error("Please enter the " + name.toLowerCase() + ".");
      }
      const value = Number(input.value);
      if (!Number.isFinite(value)) {
        throw new Error(name + " is not a valid number.");
      }
      return value;
    }

    function calculate(op) {
      try {
        const a = readNumber(num1, "First number");
        const b = readNumber(num2, "Second number");

        let result;
        switch (op) {
          case "+": result = a + b; break;
          case "-": result = a - b; break;
          case "*": result = a * b; break;
          case "/":
            if (b === 0) {
              throw new Error("Cannot divide by zero.");
            }
            result = a / b;
            break;
        }

        if (!Number.isFinite(result)) {
          throw new Error("The result is too large to display.");
        }

        // Trim floating-point noise, e.g. 0.1 + 0.2 shows 0.3.
        result = parseFloat(result.toPrecision(12));

        showResult(a + " " + symbols[op] + " " + b + " = " + result, false);
      } catch (err) {
        showResult("Error: " + err.message, true);
      }
    }

    function showResult(text, isError) {
      resultEl.textContent = text;
      resultEl.classList.toggle("error", isError);
    }

    document.querySelectorAll("button[data-op]").forEach(function (button) {
      button.addEventListener("click", function () {
        calculate(button.dataset.op);
      });
    });
  </script>
</body>
</html>
